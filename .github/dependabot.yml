version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: cron
          cronjob: "17 4 9 * *"
          timezone: Europe/Berlin
      # wait a week before proposing new releases (supply chain risk)
      cooldown:
          default-days: 7
      open-pull-requests-limit: 15
      assignees:
          - michiproep
      versioning-strategy: increase
      ignore:
          # @types/node must match the minimum supported Node.js version
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: cron
          cronjob: "17 4 9 * *"
          timezone: Europe/Berlin
      cooldown:
          default-days: 7
      open-pull-requests-limit: 15
      assignees:
          - michiproep
